name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
      - 'test/**'
      - 'tests/**'
      - 'fixtures/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      - '.github/**'
      - 'release-please-config.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the released revision
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci --ignore-scripts

      - name: Verify the release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm pack --dry-run

      - name: Verify the released version
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag: $TAG   package.json: $version"
          test "$TAG" = "v${version}"

      # No token and no --provenance flag. Trusted publishing authenticates
      # over OIDC and attests provenance by itself, given a public repository
      # and a public package. The trusted publisher on npmjs.com is bound to
      # this workflow's filename, so moving this step to another file breaks it.
      #
      # Disabled until the package is claimed on npm. Until then a release
      # produces a tag, a changelog and a GitHub release, and nothing is
      # published, which is what the README's status note promises.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created && vars.PUBLISH_TO_NPM == 'true' }}
        run: npm publish --ignore-scripts
